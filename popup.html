<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>State Change Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 16px;
            min-width: 250px;
            background: #f9f9f9;
        }
        h2 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        ul {
            padding-left: 20px;
        }
        .change {
            margin-bottom: 8px;
            background: #fff;
            border-radius: 4px;
            padding: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .no-changes {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h2>Web App State Changes</h2>
    <ul id="changes-list">
        <!-- Changes will be injected here -->
    </ul>
    <div id="no-changes" class="no-changes" style="display:none;">
        No changes detected.
    </div>
    <script src="popup.js"></script>
</body>
</html>
